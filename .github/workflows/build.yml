name: Build

# Builds Aptimizer Studio on Linux, macOS and Windows and keeps each build as a workflow artifact.
#
# AptBIM's repository is private, so cargo needs a token to fetch it: add a repository secret
# named APTBIM_TOKEN (Settings > Secrets and variables > Actions) holding a fine-grained GitHub
# token with read access to Anuj09k/AptBIM- contents.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libgtk-3-dev
      - name: Access to AptBIM's private repository
        shell: bash
        env:
          TOKEN: ${{ secrets.APTBIM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Add the APTBIM_TOKEN secret (see the top of this file)"; exit 1; fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/Anuj09k/AptBIM-".insteadOf "https://github.com/Anuj09k/AptBIM-"
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: aptimizer-studio-${{ runner.os }}
          path: |
            target/release/aptimizer-studio
            target/release/aptimizer-studio.exe
            LICENSE-APACHE
            NOTICE
