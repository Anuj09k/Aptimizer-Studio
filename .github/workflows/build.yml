name: Build and package

# Builds and packages Aptimizer Studio on Linux, macOS and Windows and keeps the packages as workflow artifacts.
#
# AptBIM's repository is private, so cargo needs a token to fetch it: add a repository secret
# named APTBIM_TOKEN (Settings > Secrets and variables > Actions) holding a fine-grained GitHub
# token with read access to Anuj09k/AptBIM- contents.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libgtk-3-dev
      - name: Access to AptBIM's private repository
        shell: bash
        env:
          TOKEN: ${{ secrets.APTBIM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Add the APTBIM_TOKEN secret (see the top of this file)"; exit 1; fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/Anuj09k/AptBIM-".insteadOf "https://github.com/Anuj09k/AptBIM-"
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Install Cargo Packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Package desktop app
        run: cargo packager --release
      - uses: actions/upload-artifact@v4
        with:
          name: aptimizer-studio-${{ runner.os }}-${{ runner.arch }}
          path: dist/**
          if-no-files-found: error
