[package]
name = "aptimizer-studio"
version = "0.1.0"
description = "Aptimizer Studio: AptCAD (drafting) and AptBIM (building modelling) in one window"
edition = "2024"
rust-version = "1.95"
# The Revit reader AptBIM includes (aptbim-rvt) is Apache-2.0 only, so a build with it is Apache-2.0.
license = "Apache-2.0"
repository = "https://github.com/Anuj09k/Aptimizer-Studio"
publish = false

[features]
default = ["rvt"]
# Opening Revit (.rvt) projects in AptBIM mode.
rvt = ["dep:aptbim-rvt"]

[dependencies]
# Both apps at pinned commits: bump a rev to take a newer AptCAD or AptBIM.
aptcad-engine = { git = "https://github.com/Anuj09k/AptCAD", rev = "d881fc37eaf686fd123e31a3460fca3067b81f8e" }
aptcad-io = { git = "https://github.com/Anuj09k/AptCAD", rev = "d881fc37eaf686fd123e31a3460fca3067b81f8e" }
aptcad-ui-egui = { git = "https://github.com/Anuj09k/AptCAD", rev = "d881fc37eaf686fd123e31a3460fca3067b81f8e" }
aptbim-core = { git = "https://github.com/Anuj09k/AptBIM-", rev = "2b2db2d1c689dff184298eeb6d9883c39ebda1c3" }
aptbim-ui-egui = { git = "https://github.com/Anuj09k/AptBIM-", rev = "2b2db2d1c689dff184298eeb6d9883c39ebda1c3" }
aptbim-dwg = { git = "https://github.com/Anuj09k/AptBIM-", rev = "2b2db2d1c689dff184298eeb6d9883c39ebda1c3" }
aptbim-rvt = { git = "https://github.com/Anuj09k/AptBIM-", rev = "2b2db2d1c689dff184298eeb6d9883c39ebda1c3", optional = true }
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "wgpu", "accesskit", "wayland", "x11", "links", "persistence"] }
rfd = "0.17"
serde_json = "1"
# The assistant's calls to Aptimizer's server; the version and TLS AptBIM's updater already uses.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sys-locale = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

# Both apps build on one egui: the fork AptCAD pins, with its winit and the PDF libraries its
# plots use, as in AptCAD's Cargo.toml (Cargo ignores a dependency's own patches); only those this build uses.
[patch.crates-io]
krilla = { version = "=0.8.2", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[package.metadata.packager]
product-name = "Aptimizer Studio"
identifier = "io.github.anuj09k.aptimizer-studio"
publisher = "Aptimizer"
authors = ["Aptimizer"]
description = "AptCAD drafting and AptBIM building modelling in one desktop app."
homepage = "https://github.com/Anuj09k/Aptimizer-Studio"
category = "GraphicsAndDesign"
license-file = "LICENSE-APACHE"
icons = ["assets/studio-256.png"]
resources = ["LICENSE-APACHE", "NOTICE"]
formats = ["default"]
out-dir = "dist"
binaries-dir = "target/release"
before-packaging-command = "cargo build --release --locked"

[[package.metadata.packager.file-associations]]
extensions = ["dxf", "dwg", "dwt"]
mime-type = "application/x-aptimizer-cad"
description = "Aptimizer Studio CAD drawing"
name = "Aptimizer Studio CAD drawing"

[[package.metadata.packager.file-associations]]
extensions = ["svg", "svgz"]
mime-type = "image/svg+xml"
description = "Aptimizer Studio vector drawing"
name = "Aptimizer Studio vector drawing"

[[package.metadata.packager.file-associations]]
extensions = ["aptbim", "ifc", "rvt"]
mime-type = "application/x-aptimizer-bim"
description = "Aptimizer Studio building model"
name = "Aptimizer Studio building model"

[package.metadata.packager.deb]
depends = ["libfontconfig1", "libgtk-3-0", "libvulkan1", "libwayland-client0", "libxkbcommon0"]
